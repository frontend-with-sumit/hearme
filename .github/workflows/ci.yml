name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hearme
          POSTGRES_PASSWORD: hearme
          POSTGRES_DB: hearme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hearme:hearme@localhost:5432/hearme
      DIRECT_URL: postgresql://hearme:hearme@localhost:5432/hearme
      # Dummy values so the built app boots in the Playwright checks (spec
      # 0003, AC-15). Constants for CI only, never real secrets, so the secret
      # scanner is told to skip these two lines.
      KEK_V1: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # gitleaks:allow
      HMAC_KEY_V1: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= # gitleaks:allow
      CURRENT_KEK_VERSION: v1
      CURRENT_HMAC_KEY_VERSION: v1
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the secret scan below can read every commit.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # src/generated/prisma is gitignored (it's generated code), so a fresh
      # checkout has no Prisma Client until this runs; lint/typecheck/build
      # all import from it.
      - run: pnpm exec prisma generate

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

      # Storybook is a separate build and must never ship to visitors (AC-13).
      - name: Check Storybook is not in the app bundle
        run: "! grep -rli storybook .next/static"

      # Story tests and the Playwright checks drive a real Chromium.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # A scoped, non-owner role that is granted everything on every new
      # table, so the AuditLog REVOKE in the migration (AC-14) has real
      # grants to remove and the smoke test can tell if it stops running.
      - name: Create the app's scoped DB role
        run: |
          PGPASSWORD=hearme psql -h localhost -U hearme -d hearme \
            -c "CREATE ROLE hearme_app WITH LOGIN PASSWORD 'ci_only';" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE hearme IN SCHEMA public GRANT ALL ON TABLES TO hearme_app;"

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      # Migration smoke test (spec 0002, Build plan task 10): the exclusion
      # constraint and the AuditLog hardening are hand-written SQL that
      # Prisma Migrate can't verify on its own, so this catches silent drift.
      - run: pnpm migrate:check

      - run: pnpm test

      # Plays the built app (`next start`) in a browser: own origin only,
      # theme without cookies, no flash, skip link, forced colours.
      - name: App level checks
        run: pnpm test:e2e
