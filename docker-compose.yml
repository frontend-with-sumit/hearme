# Local throwaway Postgres for migrations, seed and verify runs, so they never
# touch the shared Neon branch. Same credentials as the CI service container.
# The app talks to Neon through its WebSocket driver, so wsproxy sits in front
# of Postgres to speak that protocol; plain tools (prisma migrate, psql) use
# port 5434 directly.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hearme
      POSTGRES_PASSWORD: hearme
      POSTGRES_DB: hearme
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearme"]
      interval: 5s
      timeout: 5s
      retries: 10

  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPNAME: hearme
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "5433:80"
    depends_on:
      postgres:
        condition: service_healthy
